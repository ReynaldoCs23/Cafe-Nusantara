<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- The stroke color #8B7355 is a warm brownish-grey for a natural coffee vibe -->
  <g stroke="#8B7355" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.08">
    
    <!-- Coffee Bean 1 -->
    <g transform="translate(40, 40) rotate(-20) scale(1.2)">
      <path d="M 0,-8 C 6,-8 10,-3 10,2 C 10,7 6,12 0,12 C -6,12 -10,7 -10,2 C -10,-3 -6,-8 0,-8 Z" />
      <path d="M -3,-6 Q 4,2 -3,10" />
    </g>

    <!-- Coffee Bean 2 (Pair) -->
    <g transform="translate(65, 30) rotate(15) scale(1)">
      <path d="M 0,-8 C 6,-8 10,-3 10,2 C 10,7 6,12 0,12 C -6,12 -10,7 -10,2 C -10,-3 -6,-8 0,-8 Z" />
      <path d="M -3,-6 Q 4,2 -3,10" />
    </g>

    <!-- Coffee Cup with Heart -->
    <g transform="translate(220, 80) scale(1.1)">
      <path d="M-15,-5 L-11,10 C-9,16 9,16 11,10 L15,-5 Z"/>
      <path d="M13,0 C20,0 20,8 11,8"/>
      <!-- Heart Latte Art inside cup (top view abstract) -->
      <path d="M0,0 C-3,-3 -7,0 0,5 C7,0 3,-3 0,0 Z" stroke-width="0.8"/>
      <path d="M-22,14 Q0,20 22,14"/>
    </g>

    <!-- Coffee Leaf 1 -->
    <g transform="translate(80, 220) rotate(45) scale(1.3)">
      <path d="M0,-16 C12,-8 12,8 0,16 C-12,8 -12,-8 0,-16 Z"/>
      <line x1="0" y1="-14" x2="0" y2="14"/>
      <path d="M0,-4 L5,-9 M0,-9 L-5,-14 M0,2 L6,-3 M0,7 L-6,2" stroke-width="0.8"/>
    </g>

    <!-- Batik motif / Star -->
    <g transform="translate(240, 240) scale(1.2)">
      <path d="M0,-12 C6,-6 12,-6 12,0 C12,6 6,6 0,12 C-6,6 -12,6 -12,0 C-12,-6 -6,-6 0,-12 Z"/>
      <circle cx="0" cy="0" r="1.5" fill="#8B7355"/>
      <circle cx="0" cy="-6" r="0.5" fill="#8B7355" stroke="none"/>
      <circle cx="6" cy="0" r="0.5" fill="#8B7355" stroke="none"/>
      <circle cx="0" cy="6" r="0.5" fill="#8B7355" stroke="none"/>
      <circle cx="-6" cy="0" r="0.5" fill="#8B7355" stroke="none"/>
    </g>

    <!-- Scattered Beans -->
    <g transform="translate(150, 140) rotate(60)">
      <path d="M 0,-8 C 6,-8 10,-3 10,2 C 10,7 6,12 0,12 C -6,12 -10,7 -10,2 C -10,-3 -6,-8 0,-8 Z" />
      <path d="M -3,-6 Q 4,2 -3,10" />
    </g>

    <!-- Small Leaves -->
    <g transform="translate(260, 150) rotate(-60) scale(0.8)">
      <path d="M0,-16 C12,-8 12,8 0,16 C-12,8 -12,-8 0,-16 Z"/>
      <line x1="0" y1="-14" x2="0" y2="14"/>
    </g>

    <!-- Another Cup -->
    <g transform="translate(150, 260) rotate(-15) scale(0.9)">
      <path d="M-15,-5 L-11,10 C-9,16 9,16 11,10 L15,-5 Z"/>
      <path d="M13,0 C20,0 20,8 11,8"/>
      <!-- Steam -->
      <path d="M-4,-10 Q-7,-15 -3,-18 T-4,-23 M4,-9 Q1,-14 5,-17 T4,-22" stroke-width="0.8"/>
      <path d="M-22,14 Q0,20 22,14"/>
    </g>

    <!-- Extra scattered dots/stars to fill space -->
    <g transform="translate(50, 150)" fill="#8B7355" stroke="none">
      <path d="M 0,-4 L 1,-1 L 4,0 L 1,1 L 0,4 L -1,1 L -4,0 L -1,-1 Z"/>
    </g>
    
    <g transform="translate(180, 50)" fill="#8B7355" stroke="none">
      <path d="M 0,-4 L 1,-1 L 4,0 L 1,1 L 0,4 L -1,1 L -4,0 L -1,-1 Z"/>
    </g>

  </g>
</svg>
